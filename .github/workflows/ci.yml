name: ci

on:
  pull_request:
    branches: [main]  
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: run tests
        run: go test -cover ./...
  style:
      name: Style
      runs-on: ubuntu-latest

      steps:
        - name: Check out code
          uses: actions/checkout@v6

        - name: Set up Go
          uses: actions/setup-go@v6
          with:
            go-version: "1.26.0"

        - name: run gofmt
          run: test -z $(go fmt ./...)

        - name: "Staticcheck"
          uses: "staticcheck/staticcheck-action@v0.1.0"
          with:
            version: "latest"