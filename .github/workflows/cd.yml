name: cd
on:
  push:
    branches: [main]
  
jobs:
    deploy:
      name: Deploy
      runs-on: ubuntu-latest

      steps:
        - name: check out
          uses: actions/checkout@v6
        
        - name: set up go
          uses: actions/setup-go@v6
          with:
            go-version: "1.26.0"
        
        - name: build
          run: scripts/buildprod.sh
       
        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v3'

        - name: 'Use gcloud CLI'
          run: 'gcloud info'
        
        - name: 'Deploy to Cloud Run'
          run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-505214/notely-ar-repo/notely:v1 .
        - name: 'Deploy to Cloud Run'
          run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-505214/notely-ar-repo/notely:v1 --region us-central1 --allow-unauthenticated --project notely-505214 --max-instances=4